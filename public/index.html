<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship</title>

    <style>
#game-container {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    gap: 20px;
}

.player-area {
    margin: 20px;
    text-align: center;
    transition: opacity 150ms ease, transform 150ms ease;
}

.player-area.is-active {
    transform: translateY(-6px);
}

.player-area.is-inactive {
    opacity: 0.5;
}

.player-area.target-selected {
    border: 3px solid orange;
    padding: 10px;
}

.container {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 10px;
    justify-content: center;
}

.playerSel {
    padding: 8px 14px;
    border: 2px solid #1c3d5a;
    background-color: #f3f7fb;
    cursor: pointer;
    font-weight: 600;
    transition: all 150ms ease;
}

.playerSel.is-active {
    background-color: #1c3d5a;
    color: white;
}

.playerSel:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    background-color: #e0e0e0;
}

.playerSel.my-player {
    border: 3px solid #28a745;
    background-color: #d4edda;
}

.playerSel.taken {
    background-color: #f8d7da;
    border-color: #dc3545;
}

.game-board {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(10, 1fr);
    width: 300px;
    height: 300px;
    border: 2px solid black;
}

.cell {
    border: 1px solid #ccc;
    background-color: lightblue;
    cursor: pointer;
}

.cell:hover {
    background-color: #add8e6;
}

.cell.selected-target {
    background-color: yellow;
    border: 2px solid orange;
}

.ship {
    background-color: #2c5f8a;
}

.hit {
    background-color: red !important;
}

.miss {
    background-color: gray !important;
}

.shipRand {
    background-color: #007bff;
    padding: 10px 20px;
    border: none;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 150ms ease;
}

.shipRand:hover:not(:disabled) {
    background-color: #0056b3;
}

.shipRand:disabled {
    background-color: #7a7a7a;
    cursor: not-allowed;
}

.confirmAttack {
    background-color: #dc3545;
    padding: 10px 20px;
    border: none;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 150ms ease;
}

.confirmAttack:hover:not(:disabled) {
    background-color: #c82333;
}

.confirmAttack:disabled {
    background-color: #7a7a7a;
    cursor: not-allowed;
}





#turnIndicator {
    font-size: 24px;
    font-weight: bold;
    margin: 20px;
    padding: 15px;
    background-color: #f0f0f0;
    border-radius: 8px;
}

#attackStatus {
    font-size: 18px;
    margin: 10px;
    padding: 10px;
    min-height: 30px;
}

#stats {
    font-size: 16px;
    margin: 10px;
    padding: 8px 12px;
    background-color: #f0f0f0;
    border-radius: 6px;
    display: inline-block;
}

.loading-dots::after {
    content: '';
    animation: dots 1.5s steps(4, end) infinite;
}

@keyframes dots {
    0%, 20% {
        content: '';
    }
    40% {
        content: '.';
    }
    60% {
        content: '..';
    }
    80%, 100% {
        content: '...';
    }
}
    .simple-nav {
  display: flex;
  gap: 12px;
  padding: 10px 14px;
  margin: 0 0 16px 0;
  background: #ffffff;
  border: 1px solid #d9dfe7;
  border-radius: 10px;
  width: fit-content;
}

.simple-nav a {
  text-decoration: none;
  color: #1d1d1f;
  font-weight: 600;
  padding: 6px 10px;
  border-radius: 8px;
}

.simple-nav a.active {
  background: #1c3d5a;
  color: white;
}
</style>
</head>
<body>
<nav class="simple-nav"><a href="index.html" class="active">Game</a><a href="data.html">Data</a></nav>
<!--Player selection buttons-->
    <h1>Select Player</h1>
    <div class="container">
        <button class="playerSel" data-player="1">Player 1</button>
        <button class="playerSel" data-player="2">Player 2</button>
        <button class="playerSel" data-player="3">Player 3</button>
    </div>

<!--Game Status-->
   <div id="turnIndicator">Waiting for players<span class="loading-dots"></span></div>
   <!--win rate-->
    <div id="attackStatus"></div>    <div id="stats">W: 0 L: 0 (0% win rate)</div>

<!--Boards-->
 <h1>3 Player Battleship</h1>
    <div id="game-container">
        <div class="player-area" data-player="1">
            <h2>Player 1</h2>
            <div id="board-p1" class="game-board"></div>
            <div id="messages-p1" class="messages"></div>
        </div>
        <div class="player-area" data-player="2">
            <h2>Player 2</h2>
            <div id="board-p2" class="game-board"></div>
            <div id="messages-p2" class="messages"></div>
        </div>
        <div class="player-area" data-player="3">
            <h2>Player 3</h2>
            <div id="board-p3" class="game-board"></div>
            <div id="messages-p3" class="messages"></div>
        </div>
    </div>
    
<div class="container">
    <button class="shipRand" disabled>Randomize Ships</button>
    <button class="confirmAttack" disabled>Confirm Attack</button>
    <button onclick="
        if (confirm('Reset the entire game for ALL players?')) {
            fetch('/api/reset', { method: 'POST' })
                .then(() => {
                    localStorage.removeItem('battleshipClientId');
                    alert('Game reset! Refreshing...');
                    location.reload();
                });
        }
    " style="background-color: #ffc107; padding: 10px 20px; border: none; color: black; font-weight: bold; cursor: pointer;">
        🔄 Reset Game
    </button>
</div>


<button onclick="
    let name = prompt('Enter your name:');
    if (name) {
        let params = new URLSearchParams(window.location.search);
        params.set('name', name);
        window.location.href = '?' + params.toString();
    }
" style="background-color: teal; color: white; padding: 8px 14px; border: 2px solid #0d5d5d; cursor: pointer; font-weight: 600;">
    Set Name
</button>



    <script>

function getPlayerName() {
    const params = new URLSearchParams(window.location.search);
    return params.get('name') || 'Player';
}

const playerName = getPlayerName();

// Use it when setting your player:
function setMyPlayer(playerId) {
    myPlayerId = playerId;
    document.querySelector("h1").textContent = `${playerName} - ${getDisplayName(playerId)}`;

}
function updateStats(won) {
    let wins = parseInt(getCookie('wins')) || 0;
    let losses = parseInt(getCookie('losses')) || 0;
    
    if (won) {
        wins++;
        document.cookie = `wins=${wins}; max-age=31536000`;
    } else {
        losses++;
        document.cookie = `losses=${losses}; max-age=31536000`;
    }
    
    displayStats(wins, losses);
}

function displayStats(wins, losses) {
    const total = wins + losses;
    const winRate = total > 0 ? ((wins / total) * 100).toFixed(1) : 0;
    document.getElementById('stats').textContent = 
        `W: ${wins} L: ${losses} (${winRate}% win rate)`;
}

function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) {
        return parts.pop().split(';').shift();
    }
    return null;
}

const initialWins = parseInt(getCookie('wins')) || 0;
const initialLosses = parseInt(getCookie('losses')) || 0;
displayStats(initialWins, initialLosses);
        //Board creation
const boardSize = 10;

function buildBoard(boardElement) {
    for (let row = 0; row < boardSize; row += 1) {
        for (let col = 0; col < boardSize; col += 1) {
            const cell = document.createElement("div");
            cell.className = "cell";
            cell.dataset.row = row;
            cell.dataset.col = col;
            boardElement.appendChild(cell);
        }
    }
}

const boards = document.querySelectorAll(".game-board");
boards.forEach((board) => buildBoard(board));

//Boat location randomizer
const ships = [
    { name: "Aircraft Carrier", size: 5 },
    { name: "Battleship", size: 4 },
    { name: "Cruiser", size: 3 },
    { name: "Destroyer", size: 2 }
];

function getCell(board, row, col) {
    const index = row * boardSize + col;
    return board.querySelectorAll(".cell")[index]; //get specific cell
}

function randomInt(maxExclusive) {
    return Math.floor(Math.random() * maxExclusive); //random integer generator
}

function placeShipsOnBoard(board) { //place ships randomly on board
    const cells = board.querySelectorAll(".cell"); //get all cells
    cells.forEach((cell) => cell.classList.remove("ship"));//clear previous ships

    const occupied = new Set(); //track occupied cells

    ships.forEach((ship) => { //place each ship
        let placed = false; //flag for placement

        while (!placed) { //try until each ship is placed
            const isHorizontal = Math.random() < 0.5; //random orientation
            const maxRow = isHorizontal ? boardSize - 1 : boardSize - ship.size; //calculate max start positions
            const maxCol = isHorizontal ? boardSize - ship.size : boardSize - 1; 
            const startRow = randomInt(maxRow + 1);//random start row
            const startCol = randomInt(maxCol + 1);//random start column
            const coords = [];//store ship coordinates

            for (let i = 0; i < ship.size; i += 1) {//check each cell for placement
                const row = startRow + (isHorizontal ? 0 : i);//calculate row
                const col = startCol + (isHorizontal ? i : 0);//calculate column
                const key = `${row},${col}`; //unique cell key

                if (occupied.has(key)) {//check if cell is occupied
                    coords.length = 0;
                    break;
                }

                coords.push({ row, col, key });//store valid coordinate
            }

            if (coords.length === ship.size) { //if all cells valid, place ship
                coords.forEach(({ row, col, key }) => {
                    occupied.add(key);
                    const cell = getCell(board, row, col);
                    if (cell) {
                        cell.classList.add("ship");
                    }
                });
                placed = true;
            }
        }
    });
}


function renderShipsFromPositions(board, positions) { //render ships based on stored positions from earlier
    const cells = board.querySelectorAll(".cell");  //get all cells
    cells.forEach((cell) => cell.classList.remove("ship")); //clear previous ships

    positions.forEach((pos) => { //loop through each ship position
        const parts = String(pos).split(","); //I wrote code for this but AI fixed the syntax for a bug I had but I basically am taking the ship coords and splitting them up and adding a ship square to the x,y coord
        const row = Number(parts[0]);
        const col = Number(parts[1]);
        const cell = getCell(board, row, col);
        if (cell) {
            cell.classList.add("ship");
        }
    });
}
//Player assignment mechanic
const playerAreas = document.querySelectorAll(".player-area"); 
const playerButtons = document.querySelectorAll(".playerSel"); 
const shipButton = document.querySelector(".shipRand");
const confirmButton = document.querySelector(".confirmAttack");

const turnIndicator = document.getElementById("turnIndicator");
const attackStatus = document.getElementById("attackStatus");

let myPlayerId = null; //assignes games initial status
let shipsLocked = false;
let selectedTargetPlayer = null;
let selectedCell = null;
let currentTurn = "1";

//AI helped create the client ID system and taught me how to use it
function getClientId() { 
    const stored = localStorage.getItem("battleshipClientId");
    if (stored) {
        return stored;
    }
    const newId = (crypto.randomUUID && crypto.randomUUID()) || `client-${Date.now()}`;//generate unique client ID
    localStorage.setItem("battleshipClientId", newId);
    return newId;
}

function getDisplayName(playerId) {
    const params = new URLSearchParams(window.location.search);
    const myName = params.get('name');
    
    if (playerId === myPlayerId && myName) {
        return myName;
    }
    return `Player ${playerId}`; 
}



function setMyPlayer(playerId) {
    myPlayerId = playerId;

   
    document.querySelector("h1").textContent = `You are ${getDisplayName(playerId)}`;
    document.querySelector(".container").style.display = "none";

    // Show only my board as active
    playerAreas.forEach((area) => { 
        const areaPlayerId = area.dataset.player;
        const isMyBoard = areaPlayerId === playerId;
        
        area.classList.toggle("is-active", isMyBoard);
        area.classList.toggle("is-inactive", !isMyBoard);
        
        const title = area.querySelector("h2");
        if (title) {
            const label = isMyBoard ? "Your Board" : `Opponent ${areaPlayerId}`;
            title.textContent = label;
        }

        // Add click listeners to opponent boards for targeting AI helped make this if statement but I had the idea
        if (!isMyBoard) {
            area.style.cursor = "pointer";
            area.addEventListener("click", () => selectTargetPlayer(areaPlayerId));
        }
    });

    updateShipButton();
    updateTurnDisplay();
}

function selectTargetPlayer(targetPlayerId) {
    if (currentTurn !== myPlayerId) {
        attackStatus.textContent = "It's not your turn!";
        return;
    }

    if (!shipsLocked) {
        attackStatus.textContent = "Place your ships first!";
        return;
    }


    playerAreas.forEach(area => area.classList.remove("target-selected"));
    
    // Set new target
    selectedTargetPlayer = targetPlayerId;
    const targetArea = document.querySelector(`.player-area[data-player="${targetPlayerId}"]`);
    targetArea.classList.add("target-selected");
    
    attackStatus.textContent = `Selected opponent: ${getDisplayName(targetPlayerId)}. Now click a cell on their board.`;
    

    enableCellSelection(targetPlayerId);
}

function enableCellSelection(targetPlayerId) {// AI helped make this function which enables cell selection on the targeted player's board
    // Remove all previous cell listeners
    document.querySelectorAll(".cell").forEach(cell => {//remove previous listeners
        cell.replaceWith(cell.cloneNode(true));//remove all listeners
    });

    const targetBoard = document.querySelector(`.player-area[data-player="${targetPlayerId}"] .game-board`);//get targeted player's board
    const cells = targetBoard.querySelectorAll(".cell");//get all cells on that board
    
    cells.forEach(cell => {
        if (!cell.classList.contains("hit") && !cell.classList.contains("miss")) { //only add listener to un-attacked cells
            cell.addEventListener("click", () => selectCellToAttack(cell, targetPlayerId)); //add click listener
        }
    });
}

function selectCellToAttack(cell, targetPlayerId) {
    if (currentTurn !== myPlayerId) {
        attackStatus.textContent = "It's not your turn!";
        return;
    }

    // Clear previous cell selection
    document.querySelectorAll(".selected-target").forEach(c => c.classList.remove("selected-target"));
    
    // Select new cell
    cell.classList.add("selected-target");
    selectedCell = {
        row: cell.dataset.row,
        col: cell.dataset.col,
        targetPlayer: targetPlayerId
    };
    
    attackStatus.textContent = `Selected cell (${cell.dataset.row}, ${cell.dataset.col}) on ${getDisplayName(targetPlayerId)}'s board. Click Confirm Attack!`;
    confirmButton.disabled = false;
}

function updateShipButton() {
    if (!myPlayerId) {
        shipButton.disabled = true;
        shipButton.textContent = "Waiting for player assignment...";
        return;
    }

    shipButton.disabled = shipsLocked;
    shipButton.textContent = shipsLocked ? "Ships Locked" : "Randomize Ships";
}

function updateTurnDisplay() {
    if (currentTurn === myPlayerId) {
        turnIndicator.textContent = `YOUR TURN - Player ${currentTurn}`;
        turnIndicator.style.backgroundColor = "#90EE90";
        turnIndicator.classList.remove("loading-dots");
    } else {
        turnIndicator.innerHTML = `Player ${currentTurn}'s Turn<span class="loading-dots"></span>`;
        turnIndicator.style.backgroundColor = "#FFB6C1";
    }
}

async function joinGame() {
    try {
        const response = await fetch(`/api/join?clientId=${clientId}`);
        const data = await response.json();
        
        console.log("Join response:", data);

        if (data.success) {
            setMyPlayer(data.playerId);
            shipsLocked = false;
            alert(data.message);
        } else {
            alert(data.error || "Could not join game");
        }
    } catch (error) {
        console.error("Failed to join game:", error);
        alert("Server error. Please refresh the page.");
    }
}

async function refreshGameState() {
    try {
        const response = await fetch("/api/game-state");
        const data = await response.json();
        
                currentTurn = data.currentTurn;
        updateTurnDisplay();

        if (myPlayerId && data.shipsByPlayer && data.shipsLocked) {
            const myPositions = Array.isArray(data.shipsByPlayer[myPlayerId])
                ? data.shipsByPlayer[myPlayerId]
                : [];
            if (myPositions.length > 0) {
                const myBoard = document.querySelector(`.player-area[data-player="${myPlayerId}"] .game-board`);
                if (myBoard) {
                    renderShipsFromPositions(myBoard, myPositions);
                }
            }
            shipsLocked = Boolean(data.shipsLocked[myPlayerId]);
            updateShipButton();
        }

        // Update all boards with hits and misses AI helped make this part to update the game for all players
        if (data.attacks) {
            data.attacks.forEach(attack => {
                const board = document.querySelector(`.player-area[data-player="${attack.targetPlayer}"] .game-board`);
                const cell = getCell(board, attack.row, attack.col);
                if (cell) {
                    if (attack.isHit) {
                        cell.classList.add("hit");
                    } else {
                        cell.classList.add("miss");
                    }
                }
            });
        }
    } catch (error) {
        console.error("Failed to refresh game state:", error);
    }
}

shipButton.addEventListener("click", async () => {
    

    if (shipsLocked) {
        return;
    }

    const myBoard = document.querySelector(`.player-area[data-player="${myPlayerId}"] .game-board`);
    if (myBoard) {
        placeShipsOnBoard(myBoard);
        
        // COLLECT SHIP POSITIONS
        const shipCells = myBoard.querySelectorAll(".ship");
        const positions = [];
        shipCells.forEach(cell => {
            positions.push(`${cell.dataset.row},${cell.dataset.col}`);
        });
        
        console.log("Ship positions:", positions);
        
        shipsLocked = true;
        
        // Send lock status to server
        try {
            
            await fetch("/api/store-ships", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    playerId: myPlayerId, 
                    clientId,
                    positions 
                })
            });
            
            
            await fetch("/api/lock-ships", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ playerId: myPlayerId, clientId })
            });
            
            console.log("Ships locked on server");
        } catch (error) {
            console.error("Failed to lock ships:", error);
        }
        
        updateShipButton();
    }
});

confirmButton.addEventListener("click", async () => {
    if (currentTurn !== myPlayerId) {
        alert("It's not your turn!");
        return;
    }

    if (!selectedCell) {
        alert("Select a cell to attack first!");
        return;
    }

    try {
        const response = await fetch("/api/attack", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                attackerId: myPlayerId,
                targetPlayer: selectedCell.targetPlayer,
                row: selectedCell.row,
                col: selectedCell.col,
                clientId: clientId
            })
        });

        const data = await response.json();

        if (data.success) {
            const resultText = data.isHit ? "HIT!" : "MISS!";
            attackStatus.textContent = `${resultText} - ${getDisplayName(data.nextTurn)}'s turn now.`;
            
            // Apply result to board
            const targetBoard = document.querySelector(`.player-area[data-player="${selectedCell.targetPlayer}"] .game-board`);
            const cell = getCell(targetBoard, selectedCell.row, selectedCell.col);
            if (cell) {
                cell.classList.remove("selected-target");
                if (data.isHit) {
                    cell.classList.add("hit");
                } else {
                    cell.classList.add("miss");
                }
            }

            // Clear selection
            selectedCell = null;
            selectedTargetPlayer = null;
            playerAreas.forEach(area => area.classList.remove("target-selected"));
            confirmButton.disabled = true;

            // Refresh game state
            await refreshGameState();
        } else {
            alert(data.error || "Attack failed");
        }
    } catch (error) {
        console.error("Attack error:", error);
        alert("Server error during attack");
    }
});




const clientId = getClientId(); //I had a big error here I couldn't find and AI saved me by telling me to define clientId before using it
console.log("My Client ID:", clientId);

joinGame();

setInterval(refreshGameState, 2000);
    </script>
