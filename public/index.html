    <title>Battleship</title>

    <style>
#game-container {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    gap: 20px;
}

.player-area {
    margin: 20px;
    text-align: center;
    transition: opacity 150ms ease, transform 150ms ease;
}

.player-area.is-active {
    transform: translateY(-6px);
}

.player-area.is-inactive {
    opacity: 0.5;
}

.container {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 10px;
}

.playerSel {
    padding: 8px 14px;
    border: 2px solid #1c3d5a;
    background-color: #f3f7fb;
    cursor: pointer;
    font-weight: 600;
}

.playerSel.is-active {
    background-color: #1c3d5a;
    color: white;
}

.game-board {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(10, 1fr);
    width: 300px;
    height: 300px;
    border: 2px solid black;
}

.cell {
    border: 1px solid #ccc;
    background-color: lightblue;
    cursor: pointer;
}

.cell:hover {
    background-color: #add8e6;
}

.hit {
    background-color: red;
}

.miss {
    background-color: gray;
}
.shipRand{
    background-color: red;
}
.shipRand:hover{
    background-color: pink;
}
    </style>
</head>

    for (let row = 0; row < boardSize; row += 1) {
        for (let col = 0; col < boardSize; col += 1) {

            cell.dataset.row = row;
            cell.dataset.col = col;
            boardElement.appendChild(cell);

    }
}

const playerButtons = document.querySelectorAll(".playerSel");
const playerAreas = document.querySelectorAll(".player-area");

function setActivePlayer(playerId) {
    playerButtons.forEach((button) => {
        const isActive = button.dataset.player === playerId;
        button.classList.toggle("is-active", isActive);
        button.setAttribute("aria-pressed", String(isActive));
    });

    playerAreas.forEach((area) => {
        const isActive = area.dataset.player === playerId;
        area.classList.toggle("is-active", isActive);
        area.classList.toggle("is-inactive", !isActive);
        const title = area.querySelector("h2");
        if (title) {
            let label = isActive ? "Your Board" : "Opponent";
            title.textContent = `Player ${area.dataset.player} (${label})`;
        }
    });
}


playerButtons.forEach((button) => {
    button.addEventListener("click", () => {
        setActivePlayer(button.dataset.player);
    });
});
