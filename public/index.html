<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship</title>

    <style>
#game-container {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    gap: 20px;
}

.player-area {
    margin: 20px;
    text-align: center;
    transition: opacity 150ms ease, transform 150ms ease;
}

.player-area.is-active {
    transform: translateY(-6px);
}

.player-area.is-inactive {
    opacity: 0.5;
}

.container {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 10px;
}

.playerSel {
    padding: 8px 14px;
    border: 2px solid #1c3d5a;
    background-color: #f3f7fb;
    cursor: pointer;
    font-weight: 600;
    transition: all 150ms ease;
}

.playerSel.is-active {
    background-color: #1c3d5a;
    color: white;
}

.playerSel:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    background-color: #e0e0e0;
}

.playerSel.my-player {
    border: 3px solid #28a745;
    background-color: #d4edda;
}

.playerSel.taken {
    background-color: #f8d7da;
    border-color: #dc3545;
}

.game-board {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(10, 1fr);
    width: 300px;
    height: 300px;
    border: 2px solid black;
}

.cell {
    border: 1px solid #ccc;
    background-color: lightblue;
    cursor: pointer;
}

.cell:hover {
    background-color: #add8e6;
}

.ship {
    background-color: #2c5f8a;
}

.hit {
    background-color: red;
}

.miss {
    background-color: gray;
}

.shipRand {
    background-color: red;
    padding: 10px 20px;
    border: none;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 150ms ease;
}

.shipRand:hover:not(:disabled) {
    background-color: pink;
}

.shipRand:disabled {
    background-color: #7a7a7a;
    cursor: not-allowed;
}
    </style>
</head>
<body>
<!--Player selection buttons-->
    <h1>Select Player</h1>
    <div class="container">
        <button class="playerSel" data-player="1">Player 1</button>
        <button class="playerSel" data-player="2">Player 2</button>
        <button class="playerSel" data-player="3">Player 3</button>
    </div>

<!--Boards-->
 <h1>3 Player Battleship</h1>
    <div id="game-container">
        <div class="player-area" data-player="1">
            <h2>Player 1</h2>
            <div id="board-p1" class="game-board"></div>
            <div id="messages-p1" class="messages"></div>
        </div>
        <div class="player-area" data-player="2">
            <h2>Player 2</h2>
            <div id="board-p2" class="game-board"></div>
            <div id="messages-p2" class="messages"></div>
        </div>
        <div class="player-area" data-player="3">
            <h2>Player 3</h2>
            <div id="board-p3" class="game-board"></div>
            <div id="messages-p3" class="messages"></div>
        </div>
    </div>
<div class="container">
    <button class="shipRand" disabled>Select a player</button>
</div>

    <script>
        //Board creation
const boardSize = 10;

function buildBoard(boardElement) {
    for (let row = 0; row < boardSize; row += 1) {
        for (let col = 0; col < boardSize; col += 1) {
            const cell = document.createElement("div");
            cell.className = "cell";
            cell.dataset.row = row;
            cell.dataset.col = col;
            boardElement.appendChild(cell);
        }
    }
}

const boards = document.querySelectorAll(".game-board");
boards.forEach((board) => buildBoard(board));

//Boat location randomizer
const ships = [
    { name: "Aircraft Carrier", size: 5 },
    { name: "Battleship", size: 4 },
    { name: "Cruiser", size: 3 },
    { name: "Destroyer", size: 2 }
];

function getCell(board, row, col) {
    const index = row * boardSize + col;
    return board.querySelectorAll(".cell")[index];
}

function randomInt(maxExclusive) {
    return Math.floor(Math.random() * maxExclusive);
}

function placeShipsOnBoard(board) {
    const cells = board.querySelectorAll(".cell");
    cells.forEach((cell) => cell.classList.remove("ship"));

    const occupied = new Set();

    ships.forEach((ship) => {
        let placed = false;

        while (!placed) { //AI helped create this ship placement mechanic
            const isHorizontal = Math.random() < 0.5; //here making it random whether the ship is horizontal or vertical
            const maxRow = isHorizontal ? boardSize - 1 : boardSize - ship.size;
            const maxCol = isHorizontal ? boardSize - ship.size : boardSize - 1;//calculating max starting positions
            const startRow = randomInt(maxRow + 1); //AI helped create this ship placement mechanic
            const startCol = randomInt(maxCol + 1);
            const coords = [];

            for (let i = 0; i < ship.size; i += 1) { //checking if the ship can fit in the chosen position
                const row = startRow + (isHorizontal ? 0 : i);
                const col = startCol + (isHorizontal ? i : 0); //calculating each cell the ship would occupy
                const key = `${row},${col}`;//creating a key for each cell to return back to check for occupation

                if (occupied.has(key)) { //if any cell is already occupied, break and try again
                    coords.length = 0;
                    break;
                }

                coords.push({ row, col, key });//storing the coordinates if the cell is free
            }

            if (coords.length === ship.size) {
                coords.forEach(({ row, col, key }) => {
                    occupied.add(key);
                    const cell = getCell(board, row, col);
                    if (cell) {
                        cell.classList.add("ship");
                    }
                });
                placed = true;
            }
        }
    });
}

//Player assignment mechanic
const playerButtons = document.querySelectorAll(".playerSel");
const playerAreas = document.querySelectorAll(".player-area");
const shipButton = document.querySelector(".shipRand");
let myPlayerId = null;
let shipsLocked = false;

function getClientId() {
    const stored = localStorage.getItem("battleshipClientId");
    if (stored) {
        return stored;
    }
    const newId = (crypto.randomUUID && crypto.randomUUID()) || `client-${Date.now()}`; //AI is helpful with UUID syntax i didn't really know how to do this 
    localStorage.setItem("battleshipClientId", newId);
    return newId;
}

const clientId = getClientId();
console.log("My Client ID:", clientId);

function setMyPlayer(playerId) {
    myPlayerId = playerId;

    // Hide player selection buttons
    document.querySelector("h1").textContent = `You are Player ${playerId}`;
    document.querySelector(".container").style.display = "none";

    // Show only my board as active
    playerAreas.forEach((area) => {
        const areaPlayerId = area.dataset.player;
        const isMyBoard = areaPlayerId === playerId;
        
        area.classList.toggle("is-active", isMyBoard);
        area.classList.toggle("is-inactive", !isMyBoard);
        
        const title = area.querySelector("h2");
        if (title) {
            const label = isMyBoard ? "Your Board" : `Opponent ${areaPlayerId}`;
            title.textContent = label;
        }
    });

    updateShipButton();
}

function updateShipButton() {
    if (!myPlayerId) {
        shipButton.disabled = true;
        shipButton.textContent = "Waiting for player assignment...";
        return;
    }

    shipButton.disabled = shipsLocked;
    shipButton.textContent = shipsLocked ? "Ships Locked" : "Randomize Ships";
}

async function joinGame() { //AI helped create an auto join feature so we can drop the buttons and make it so that the game automatically assigns you to a player
    try {
        const response = await fetch(`/api/join?clientId=${clientId}`);
        const data = await response.json(); //get which player ID is next available
        
        console.log("Join response:", data);

        if (data.success) {
            setMyPlayer(data.playerId);
            shipsLocked = false;
            alert(data.message); // Notify user of their player assignment
        } else {
            alert(data.error || "Could not join game"); // Show error if joining failed
        }
    } catch (error) { //gives a server error alert if something goes wrong with the fetch
        console.error("Failed to join game:", error);
        alert("Server error. Please refresh the page."); 
    }
}

shipButton.addEventListener("click", async () => {
    

    if (shipsLocked) {
        return;
    }

    const myBoard = document.querySelector(`.player-area[data-player="${myPlayerId}"] .game-board`);//ai is really helpful with syntax 
    if (myBoard) {
        placeShipsOnBoard(myBoard);
        shipsLocked = true;
        
        // Send lock status to server
        try {
            await fetch("/api/lock-ships", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ playerId: myPlayerId, clientId })
            });
            console.log("Ships locked on server");
        } catch (error) {
            console.error("Failed to lock ships:", error);
        }
        
        updateShipButton();
    }
});

// Auto-join on page load
joinGame();
</script>
</body>
</html>
