<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship</title>

    <style>
#game-container {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    gap: 20px;
}

.player-area {
    margin: 20px;
    text-align: center;
    transition: opacity 150ms ease, transform 150ms ease;
}

.player-area.is-active {
    transform: translateY(-6px);
}

.player-area.is-inactive {
    opacity: 0.5;
}

.container {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 10px;
}

.playerSel {
    padding: 8px 14px;
    border: 2px solid #1c3d5a;
    background-color: #f3f7fb;
    cursor: pointer;
    font-weight: 600;
}

.playerSel.is-active {
    background-color: #1c3d5a;
    color: white;
}

.game-board {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(10, 1fr);
    width: 300px;
    height: 300px;
    border: 2px solid black;
}

.cell {
    border: 1px solid #ccc;
    background-color: lightblue;
    cursor: pointer;
}

.cell:hover {
    background-color: #add8e6;
}

.ship {
    background-color: #2c5f8a;
}

.hit {
    background-color: red;
}

.miss {
    background-color: gray;
}

.shipRand {
    background-color: red;
}

.shipRand:hover {
    background-color: pink;
}

.shipRand:disabled {
    background-color: #7a7a7a;
    cursor: not-allowed;
}
    </style>
</head>
<body>
<!--Player selection buttons-->
    <h1>Select Player</h1>
    <div class="container">
        <button class="playerSel" data-player="1">Player 1</button>
        <button class="playerSel" data-player="2">Player 2</button>
        <button class="playerSel" data-player="3">Player 3</button>
    </div>

<!--Boards-->
 <h1>3 Player Battleship</h1>
    <div id="game-container">
        <div class="player-area" data-player="1">
            <h2>Player 1</h2>
            <div id="board-p1" class="game-board"></div>
            <div id="messages-p1" class="messages"></div>
        </div>
        <div class="player-area" data-player="2">
            <h2>Player 2</h2>
            <div id="board-p2" class="game-board"></div>
            <div id="messages-p2" class="messages"></div>
        </div>
        <div class="player-area" data-player="3">
            <h2>Player 3</h2>
            <div id="board-p3" class="game-board"></div>
            <div id="messages-p3" class="messages"></div>
        </div>
    </div>
<div class="container">
    <button class="shipRand">Randomize Ships</button>
</div>



    <script>
        //Board creation
const boardSize = 10;

function buildBoard(boardElement) {
    for (let row = 0; row < boardSize; row += 1) {
        for (let col = 0; col < boardSize; col += 1) {
            const cell = document.createElement("div");
            cell.className = "cell";
            cell.dataset.row = row;
            cell.dataset.col = col;
            boardElement.appendChild(cell);
        }
    }
}

const boards = document.querySelectorAll(".game-board");
boards.forEach((board) => buildBoard(board));

//Boat location randomizer
const ships = [
    { name: "Aircraft Carrier", size: 5 },
    { name: "Battleship", size: 4 },
    { name: "Cruiser", size: 3 },
    { name: "Destroyer", size: 2 }
];

function getCell(board, row, col) {
    let index = row * boardSize + col;
    return board.querySelectorAll(".cell")[index];
}

function randomInt(maxExclusive) { //AI helped a lot with this for function cuz I was so lost but I placed comments to show I can describe whats going on
    return Math.floor(Math.random() * maxExclusive);
}

function placeShipsOnBoard(board) {
    const cells = board.querySelectorAll(".cell");
    cells.forEach((cell) => cell.classList.remove("ship"));

    const occupied = new Set();

    ships.forEach((ship) => {
        let placed = false;

        while (!placed) {
            const isHorizontal = Math.random() < 0.5; //randomize if the ship will hor or vert
            const maxRow = isHorizontal ? boardSize - 1 : boardSize - ship.size; //malmost like shifting the coord system for vert and hor
            const maxCol = isHorizontal ? boardSize - ship.size : boardSize - 1;
            const startRow = randomInt(maxRow + 1); //selects starting position
            const startCol = randomInt(maxCol + 1);
            const coords = [];

            for (let i = 0; i < ship.size; i += 1) { //AI helped a lot with this for loop cuz I was so lost but I placed comments to show I can describe whats going on
                const row = startRow + (isHorizontal ? 0 : i);
                const col = startCol + (isHorizontal ? i : 0); //here we're assigning variables for the index of the row and oclumn
                const key = `${row},${col}`; //this is the index of the square

                if (occupied.has(key)) {
                    coords.length = 0; //this is saying if the square is occupied don't place anything and break the loop
                    break;
                }

                coords.push({ row, col, key }); // otherwise these coords can place a ship 
            }

            if (coords.length === ship.size) { //check the length of the coords that can place a ship and place a ship acordingly
                coords.forEach(({ row, col, key }) => {
                    occupied.add(key);
                    const cell = getCell(board, row, col); // will mark taken squares ass occupied
                    if (cell) {
                        cell.classList.add("ship"); //add the ship class to each of the squares for css to take place
                    }
                });
                placed = true; // end the loop
            }
        }
    });
}

//Player selection mechanic
const playerButtons = document.querySelectorAll(".playerSel");
const playerAreas = document.querySelectorAll(".player-area");
const shipButton = document.querySelector(".shipRand");
let activePlayerId = null;
let shipsLocked = false;

function setActivePlayer(playerId) {
    activePlayerId = playerId;

    playerButtons.forEach((button) => {
        const isActive = button.dataset.player === playerId;
        button.classList.toggle("is-active", isActive);
        button.setAttribute("aria-pressed", String(isActive));
    });

    playerAreas.forEach((area) => {
        const isActive = area.dataset.player === playerId;
        area.classList.toggle("is-active", isActive);
        area.classList.toggle("is-inactive", !isActive);
        const title = area.querySelector("h2");
        if (title) {
            const label = isActive ? "Your Board" : "Opponent";
            title.textContent = `Player ${area.dataset.player} (${label})`;
        }
    });
}

playerButtons.forEach((button) => {
    button.addEventListener("click", () => {
        setActivePlayer(button.dataset.player);
    });
});

shipButton.addEventListener("click", () => {
    if (shipsLocked) {
        return;
    }

    if (!activePlayerId) {
        alert("Select a player first.");
        return;
    }

    const activeBoard = document.querySelector(`.player-area[data-player="${activePlayerId}"] .game-board`);
    if (activeBoard) {
        placeShipsOnBoard(activeBoard);
        shipsLocked = true;
        shipButton.disabled = true;
        shipButton.textContent = "Ships Locked";
    }
});
    </script>
</body>
</html>
